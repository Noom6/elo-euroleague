# Chaque nuit : récupère les nouveaux matchs d'Euroleague, recalcule l'Elo et republie le site sur GitHub Pages.
name: Mise à jour du classement

on:
  schedule:
    - cron: "30 4 * * *" # tous les jours à 4 h 30 UTC, après les matchs européens de la veille
  workflow_dispatch: # bouton « Run workflow » pour lancer une mise à jour à la main
  push:
    branches: [main]

permissions:
  contents: write # enregistrer l'historique mis à jour dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Garde les fiches brutes déjà téléchargées d'une nuit à l'autre : seuls les nouveaux matchs sont récupérés.
      - name: Cache des fiches de match
        uses: actions/cache@v4
        with:
          path: data/raw
          key: euroleague-raw-${{ github.run_id }}
          restore-keys: euroleague-raw-

      - name: Télécharger, condenser, calculer
        run: node update.js

      - name: Enregistrer l'historique mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "Pas de nouveau match."
          else
            git commit -m "Nouveaux matchs Euroleague ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
